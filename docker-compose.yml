services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockflow_db
    ports:
      - "5432:5432"

  api:
    build: ./StockFlowAPI
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=stockflow_db;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development